[package]
name = "codex-retrieval"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Unified retrieval engine combining context files, embeddings, and directory watching"

[lib]
doctest = false

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["full"] }

# Serialization
serde = { workspace = true, features = ["derive"] }

# Error handling
thiserror.workspace = true

# Time handling
dirs.workspace = true

# Logging
tracing.workspace = true

# Internal dependencies
codex-context-files = { workspace = true }
codex-embeddings = { workspace = true }
codex-directory-watcher = { workspace = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
